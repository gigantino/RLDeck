name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.next.outputs.bump }}
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: next
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

          if [ -z "$previous" ]; then
            version=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
            echo "no tags yet, releasing Cargo.toml's v$version"
            echo "bump=first" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subjects=$(git log --format=%s "$previous..HEAD")
          bodies=$(git log --format=%B "$previous..HEAD")

          if   grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$subjects"; then bump=major
          elif grep -qE '^BREAKING[ -]CHANGE:'  <<< "$bodies";   then bump=major
          elif grep -qE '^feat(\([^)]*\))?:'    <<< "$subjects"; then bump=minor
          elif grep -qE '^fix(\([^)]*\))?:'     <<< "$subjects"; then bump=patch
          else bump=none
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"

          if [ "$bump" = none ]; then
            echo "nothing releasable since $previous"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${previous#v}"
          case $bump in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          echo "$previous + $bump = v$major.$minor.$patch"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      ARTIFACT: rldeck-v${{ needs.version.outputs.version }}-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: rustup update stable --no-self-update && rustup default stable

      - name: Install NASM for aws-lc-sys
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Set the version
        if: needs.version.outputs.bump != 'first'
        run: |
          sed -i "0,/^version = /s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          grep -m1 -E '^version = ' Cargo.toml

      - run: cargo test

      - run: cargo build --release

      - name: Package
        run: |
          cd target/release
          mv rldeck.exe RLDeck.exe
          7z a "../../$ARTIFACT" RLDeck.exe

      - name: Write the release notes
        run: |
          range="${PREVIOUS:+$PREVIOUS..}HEAD"

          feats=$(git log --format=%s "$range" | sed -n -E 's/^feat(\([^)]*\))?!?: //p')
          fixes=$(git log --format=%s "$range" | sed -n -E 's/^fix(\([^)]*\))?!?: //p')

          {
            if [ -n "$feats" ]; then echo "## Added"; echo; sed 's/^/- /' <<< "$feats"; echo; fi
            if [ -n "$fixes" ]; then echo "## Fixed"; echo; sed 's/^/- /' <<< "$fixes"; echo; fi
          } > notes.md

          cat notes.md

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git commit -am "chore: release v$VERSION [skip ci]"
            git push
          fi

          git tag "v$VERSION"
          git push origin "v$VERSION"

          gh release create "v$VERSION" "$ARTIFACT" --title "v$VERSION" --notes-file notes.md
