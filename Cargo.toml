[package]
name = "rldeck"
version = "0.2.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
iced = { version = "0.14.0", default-features = false, features = ["fira-sans", "image-without-codecs", "svg", "tokio", "wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt"] }
zip = "8.6.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
